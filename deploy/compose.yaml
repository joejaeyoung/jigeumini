x-runtime: &runtime
  image: ${SERVER_IMAGE:?}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=64m]
  mem_limit: 640m
  cpus: 1.0
  stop_grace_period: 60s
  networks: [data]
  labels:
    io.jigeumini.deployment.owner: ${DEPLOYMENT_OWNER:?}
  secrets: [runtime_password]
  environment: &runtime-env
    PIPELINE_JDBC_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-chatpulse}
    PIPELINE_DB_USER: app_runtime
    PIPELINE_DB_PASSWORD_FILE: /run/secrets/runtime_password
    PIPELINE_BOOTSTRAP_SERVERS: kafka:9092
    PIPELINE_GROUP: ${CONSUMER_GROUP:-deploy-live}
    PIPELINE_RUN_ID: deploy-v1
    PIPELINE_KAFKA_DURABILITY: LOCAL
    PIPELINE_SCHEMA_MODE: VALIDATE
    PIPELINE_OFFSET_RESET: none
    METADATA_ENABLED: 'false'
    DEPLOYMENT_ENABLED: 'true'
    DEPLOYMENT_RECOVERY_GUARD: 'true'
services:
  postgres:
    image: postgres:16.14-alpine
    mem_limit: 384m
    cpus: 1.0
    shm_size: 128m
    networks: [data]
    labels:
      io.jigeumini.deployment.owner: ${DEPLOYMENT_OWNER:?}
    environment:
      POSTGRES_DB: chatpulse
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
    secrets: [owner_password,runtime_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U app_owner -d chatpulse']
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.1.2
    mem_limit: 768m
    cpus: 1.0
    networks: [data]
    labels:
      io.jigeumini.deployment.owner: ${DEPLOYMENT_OWNER:?}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
    volumes: [kafka-data:/var/lib/kafka/data]
    tmpfs: [/etc/kafka/secrets,/mnt/shared/config]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 3s
      timeout: 8s
      retries: 30
  migrate:
    <<: *runtime
    profiles: [maintenance]
    environment:
      <<: *runtime-env
      PIPELINE_DB_USER: app_owner
      PIPELINE_DB_PASSWORD_FILE: /run/secrets/owner_password
      OPS_GRANT_RUNTIME: 'true'
    secrets: [owner_password]
    command: [ops,migrate]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *runtime
    networks: [data,service]
    command:
      - --spring.profiles.active=pipeline
      - --pipeline.role=analyzer
      - --spring.main.web-application-type=servlet
      - --server.address=0.0.0.0
      - --server.port=8080
      - --server.shutdown=graceful
      - --spring.lifecycle.timeout-per-shutdown-phase=45s
      - --logging.level.root=OFF
      - --logging.level.io.chatpulse=OFF
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD,java,-Xmx32m,-cp,'/app/classes:/app/lib/*',io.chatpulse.poc.PocApplication,ops,probe]
      interval: 15s
      timeout: 8s
      retries: 24
      start_period: 15s
  web:
    image: ${WEB_IMAGE:?}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=32m]
    mem_limit: 64m
    cpus: 0.5
    stop_grace_period: 15s
    networks: [service,edge]
    ports: ['127.0.0.1::8080']
    labels:
      io.jigeumini.deployment.owner: ${DEPLOYMENT_OWNER:?}
    depends_on:
      api: {condition: service_healthy}
secrets:
  owner_password: {file: '${OWNER_PASSWORD_FILE:?}'}
  runtime_password: {file: '${RUNTIME_PASSWORD_FILE:?}'}
networks:
  data: {internal: true, labels: {io.jigeumini.deployment.owner: '${DEPLOYMENT_OWNER:?}'}}
  service: {internal: true, labels: {io.jigeumini.deployment.owner: '${DEPLOYMENT_OWNER:?}'}}
  edge: {labels: {io.jigeumini.deployment.owner: '${DEPLOYMENT_OWNER:?}'}}
volumes:
  postgres-data: {labels: {io.jigeumini.deployment.owner: '${DEPLOYMENT_OWNER:?}'}}
  kafka-data: {labels: {io.jigeumini.deployment.owner: '${DEPLOYMENT_OWNER:?}'}}
