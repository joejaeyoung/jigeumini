plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
}

group = 'io.chatpulse'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}
repositories { mavenCentral() }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.9')
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework:spring-jdbc'
    implementation 'com.zaxxer:HikariCP'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.java-websocket:Java-WebSocket:1.6.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    useJUnitPlatform { excludeTags 'integration' }
    testLogging { events 'failed', 'skipped' }
}
tasks.named('bootJar') { archiveFileName = 'chat-pulse-poc.jar' }

// 소스·리소스·의존 JAR의 같은 내용을 같은 빌드 식별자로 고정한다. 시각·로컬 경로는 포함하지 않는다.
def replayBuildDir = layout.buildDirectory.dir('generated/replay-build')
tasks.register('replayBuildIdentity') {
    inputs.files(fileTree('src/main'), file('build.gradle'), rootProject.file('settings.gradle'), configurations.runtimeClasspath)
    outputs.dir(replayBuildDir)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def entries = [:]
        fileTree('src/main').files.each { entries['source/' + projectDir.toPath().relativize(it.toPath()).toString()] = it }
        entries['build.gradle'] = file('build.gradle')
        entries['settings.gradle'] = rootProject.file('settings.gradle')
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each {
            entries['dependency/' + it.moduleVersion.id.toString() + '/' + it.file.name] = it.file
        }
        entries.sort().each { name, artifact ->
            digest.update(name.getBytes('UTF-8')); digest.update((byte) 0)
            artifact.withInputStream { input ->
                byte[] buffer = new byte[65536]; int length
                while ((length = input.read(buffer)) != -1) digest.update(buffer, 0, length)
            }
            digest.update((byte) 0)
        }
        def output = replayBuildDir.get().file('replay-build-id.txt').asFile
        output.parentFile.mkdirs(); output.text = digest.digest().encodeHex().toString() + '\n'
    }
}
sourceSets.main.resources.srcDir(replayBuildDir)
tasks.named('processResources') { dependsOn tasks.named('replayBuildIdentity') }

tasks.register('integrationTest', Test) {
    dependsOn tasks.named('bootJar')
    description = '로컬 Compose Kafka/PostgreSQL에서 격리된 통합 검증'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    systemProperty 'integration.classpath', sourceSets.test.runtimeClasspath.asPath
    shouldRunAfter test
    testLogging { events 'passed', 'failed', 'skipped' }
}

tasks.register('loadExperiment', JavaExec) {
    description = '격리된 로컬 합성 부하 실험과 정제 리포트'
    group = 'verification'
    dependsOn tasks.named('testClasses'), tasks.named('bootJar')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.chatpulse.pipeline.LoadExperiment'
    maxHeapSize = '768m'
    workingDir = rootProject.projectDir
    args providers.gradleProperty('experimentProfile').getOrElse('smoke'), providers.gradleProperty('experimentOutput').getOrElse('work/experiment-smoke.json')
    if (providers.gradleProperty('experimentBase').isPresent()) args providers.gradleProperty('experimentBase').get()
}

tasks.register('haExperiment', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.chatpulse.pipeline.KafkaHaExperiment'
    workingDir = rootProject.projectDir
    maxHeapSize = '256m'
    if (project.hasProperty('haOutput')) args(project.property('haOutput'))
}

tasks.register('ackExperiment', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.chatpulse.pipeline.AckCommitExperiment'
    workingDir = rootProject.projectDir
    maxHeapSize = '256m'
    if (project.hasProperty('ackOutput')) args(project.property('ackOutput'))
}

tasks.register('diskLossExperiment', JavaExec) {
    description = '소유 Kafka replica 디스크 교체·마지막 복사본 손실 검증'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.chatpulse.pipeline.KafkaDiskLossExperiment'
    workingDir = rootProject.projectDir
    maxHeapSize = '256m'
    if (project.hasProperty('diskScenario') && project.hasProperty('diskOutput')) args(project.property('diskScenario'), project.property('diskOutput'))
}

tasks.register('productLoadFixtures', Sync) {
    description = '격리 부하 원천의 테스트 전용 WebSocket 의존성 고정'
    dependsOn testClasses
    from(configurations.testRuntimeClasspath) { include 'Java-WebSocket-*.jar' }
    into layout.buildDirectory.dir('product-load-libs')
}
