name: 지금이니 검증
on:
  pull_request:
  push:
    branches: [main, develop, 'release/**', 'technicaltest/**', 'feat/**', 'fix/**']
permissions:
  contents: read
jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Git Flow 대상 확인
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_BRANCH" == main && "$HEAD_BRANCH" != release/* && "$HEAD_BRANCH" != fix/hotfix-* ]]; then
            echo 'main에는 release/* 또는 fix/hotfix-* PR만 허용합니다. 기능 PR은 develop을 대상으로 만드세요.'
            exit 1
          fi
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/check
      - run: ./scripts/integration
      - run: docker compose down
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: |
            server/build/reports/tests
            server/build/test-results
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: ./scripts/web install
      - run: ./scripts/web check
      - run: ./scripts/web browser-install
      - run: ./scripts/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: web/test-results
