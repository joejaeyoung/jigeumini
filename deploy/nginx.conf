server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://api:8080;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
        # 재생성된 API 주소를 Docker DNS에서 다시 확인한다.
        proxy_pass $backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 @api_unavailable;
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"API_UNAVAILABLE"}';
    }
    location = /livez { proxy_pass $backend/livez; }
    location = /readyz { proxy_pass $backend/readyz; }
    location = /revision.json { add_header Cache-Control "no-store"; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public,max-age=31536000,immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
