# 로컬 장애 리허설 전용. 단일 호스트의 rack 이름은 실제 장애 도메인을 뜻하지 않는다.
x-common-env: &common-env
  CLUSTER_ID: ${JIGEUMINI_HA_CLUSTER_ID:?}
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1001@controller1:9093,1002@controller2:9093,1003@controller3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
x-labels: &labels
  io.chatpulse.ha.owner: ${JIGEUMINI_HA_OWNER:?}
x-controller: &controller
  image: apache/kafka:4.1.2
  mem_limit: 384m
  cpus: 1
  labels: *labels
  tmpfs: ['/etc/kafka/secrets:rw,mode=0755', '/mnt/shared/config:rw,mode=0755']
  environment: &controller-env
    <<: *common-env
    KAFKA_PROCESS_ROLES: controller
    KAFKA_LISTENERS: CONTROLLER://:9093
    KAFKA_HEAP_OPTS: -Xms64m -Xmx192m
x-broker: &broker
  image: apache/kafka:4.1.2
  mem_limit: 512m
  cpus: 1
  labels: *labels
  tmpfs: ['/etc/kafka/secrets:rw,mode=0755', '/mnt/shared/config:rw,mode=0755']
  environment: &broker-env
    <<: *common-env
    KAFKA_PROCESS_ROLES: broker
    KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092
    KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 3
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_REPLICA_LAG_TIME_MAX_MS: 3000
    KAFKA_BROKER_SESSION_TIMEOUT_MS: 6000
    KAFKA_NUM_NETWORK_THREADS: 2
    KAFKA_NUM_IO_THREADS: 2
    KAFKA_LOG_RETENTION_BYTES: 268435456
    KAFKA_LOG_SEGMENT_BYTES: 33554432
services:
  controller1:
    volumes: ['controller1-data:/var/lib/kafka/data']
    <<: *controller
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1001
  controller2:
    volumes: ['controller2-data:/var/lib/kafka/data']
    <<: *controller
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1002
  controller3:
    volumes: ['controller3-data:/var/lib/kafka/data']
    <<: *controller
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1003
  broker1:
    volumes: ['broker1-data:/var/lib/kafka/data']
    <<: *broker
    ports: ['127.0.0.1:${JIGEUMINI_HA_PORT_1:?}:19092']
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_RACK: local-rack-1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:9092,EXTERNAL://localhost:${JIGEUMINI_HA_PORT_1:?}
  broker2:
    volumes: ['broker2-data:/var/lib/kafka/data']
    <<: *broker
    ports: ['127.0.0.1:${JIGEUMINI_HA_PORT_2:?}:19092']
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_BROKER_RACK: local-rack-2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker2:9092,EXTERNAL://localhost:${JIGEUMINI_HA_PORT_2:?}
  broker3:
    volumes: ['broker3-data:/var/lib/kafka/data']
    <<: *broker
    ports: ['127.0.0.1:${JIGEUMINI_HA_PORT_3:?}:19092']
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_BROKER_RACK: local-rack-3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker3:9092,EXTERNAL://localhost:${JIGEUMINI_HA_PORT_3:?}

volumes:
  controller1-data:
    labels: *labels
  controller2-data:
    labels: *labels
  controller3-data:
    labels: *labels
  broker1-data:
    labels: *labels
  broker2-data:
    labels: *labels
  broker3-data:
    labels: *labels
