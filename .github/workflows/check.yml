name: 지금이니 검증
on:
  pull_request:
  push:
    branches: [main, develop, 'release/**', 'technicaltest/**', 'feat/**', 'fix/**', 'refactor/**']
permissions:
  contents: read
jobs:
  tech-goals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 기술 목표 연결과 기존 ID 보존 검사
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -n "$BASE_REV" && ! "$BASE_REV" =~ ^0+$ ]]; then
            if ! git cat-file -e "${BASE_REV}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_REV" || true
            fi
            if git cat-file -e "${BASE_REV}^{commit}" 2>/dev/null; then
              python3 scripts/check-tech-goals.py --base "$BASE_REV"
            elif [[ "$EVENT_NAME" == pull_request ]]; then
              echo '::error::PR 기준 commit을 가져올 수 없어 삭제 검사를 완료하지 못했습니다.'
              exit 1
            else
              echo '::warning::push 이전 commit을 가져올 수 없어 ID 삭제 비교를 생략합니다. PR 기준 비교가 필요합니다.'
              python3 scripts/check-tech-goals.py
            fi
          else
            python3 scripts/check-tech-goals.py
          fi
          python3 scripts/check-doc-links.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Git Flow 대상 확인
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_BRANCH" == main && "$HEAD_BRANCH" != release/* && "$HEAD_BRANCH" != fix/hotfix-* ]]; then
            echo 'main에는 release/* 또는 fix/hotfix-* PR만 허용합니다. 기능 PR은 develop을 대상으로 만드세요.'
            exit 1
          fi
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/check
      - run: ./scripts/integration
      - run: docker compose down
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: |
            server/build/reports/tests
            server/build/test-results
            server/build/fleet-*.json
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: ./scripts/web install
      - run: ./scripts/web check
      - run: ./scripts/web browser-install
      - run: ./scripts/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: web/test-results
